[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentos-runtime"
version = "0.2.0"
description = "SearchRL: GRPO-trained multi-tool search agent, built on the AgentOS multi-agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "matplotlib==3.10.3",
  "mcp[cli]==2.3.0",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pydantic==2.12.5",
  "pydantic-settings==2.9.1",
  "python-dotenv==1.1.0",
  "pyyaml==6.0.2",
  "rank-bm25==0.2.2",
  "scipy==1.15.3",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
graph = ["langgraph>=0.4.7,<1.0"]
rag = ["sentence-transformers>=4.1,<6", "torch>=2.6,<3"]
dashboard = ["streamlit>=1.45,<2"]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "pytest-cov==6.1.1", "ruff==0.11.11"]

[tool.hatch.build.targets.wheel]
packages = ["agentos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

